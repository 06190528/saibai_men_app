name: saibai_men_app
description: A new Flutter project.
publish_to: "none"
version: 1.0.5

environment:
  sdk: ">=2.17.0 <3.0.0"
  flutter: ">=2.5.0"

dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads: ^2.4.0
  cupertino_icons: ^1.0.2
  flutter_launcher_icons: ^0.13.1
  audioplayers: ^5.2.0
  flutter_riverpod: ^2.4.5
  flame: ^1.13.1
  flame_audio: ^2.1.6
  flame_forge2d: ^0.16.0+3
  flame_tiled: ^1.18.2
  firebase_core: ^2.25.3
  cloud_firestore: ^4.15.3
  intl: ^0.19.0
  shared_preferences: ^2.0.6
  firebase_auth: ^4.16.0
  webview_flutter: ^4.4.4
  animated_text_kit: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/custom_font.ttf
  assets:
    - assets/images/background.png
    - assets/images/enemy_transparent_right.png
    - assets/images/enemy_transparent_left.png
    - assets/images/enemy_transparent_down.png
    - assets/images/enemy_transparent_up.png
    - assets/images/energy bullet.png
    - assets/images/energy icon.png
    - assets/images/yamucha_sprit.png
    - assets/images/explosion_sprite.png
    - assets/images/titleScene.png
    - assets/images/padlock.png
    - assets/images/ki_sprite.png
    - assets/images/sander_sprite.png
    - assets/sounds/explosion.mp3
    - assets/sounds/bgm.wav
    - assets/sounds/specialMove.mp3
    - assets/sounds/getItemSound.mp3
    - assets/sounds/sub_bgm.mp3
    - assets/sounds/ki1.1.mp3
    - assets/sounds/ki1.2.mp3
    - assets/sounds/super_ki.mp3
flutter_launcher_icons:
  image_path: "assets/images/icon.png"
  android: true
  ios: true
